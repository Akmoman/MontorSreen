<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة مدرسة بلال بن رباح للبنين</title>
<style>
  :root {
    --bg1: #0b2a4a; --bg2: #123f6d;
    --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.16);
    --gold: #f6c453; --green: #3ddc97; --red: #ff5d5d; --text: #fff; --muted: #b9cbe0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: calc(100vh / 54); }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Noto Sans Arabic", Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text); height: 100vh; width: 100vw; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto; gap: 1rem; padding: 1rem;
    cursor: none; user-select: none;
  }
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 1.2rem; padding: .8rem 1.6rem;
  }
  .title { text-align: center; }
  .title h1 { font-size: 3.2rem; color: var(--gold); line-height: 1.2; }
  .title p { font-size: 1.3rem; color: var(--muted); }
  .clock { text-align: left; direction: ltr; }
  .clock .time { font-size: 4.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .clock .sec { font-size: 2rem; color: var(--gold); }
  .clock .ampm { font-size: 1.6rem; color: var(--muted); margin-inline-start: .4rem; }
  .datebox { font-size: 1.6rem; line-height: 1.5; }
  .datebox .hijri { color: var(--muted); font-size: 1.3rem; }
  main { display: grid; grid-template-columns: 1.2fr 1.1fr 1.1fr; gap: 1rem; min-height: 0; }
  .left-col { display: flex; flex-direction: column; gap: 1rem; min-height: 0; }
  .left-col .panel { flex: 1; }
  .vid-panel { padding: 0; position: relative; border-radius: 1.2rem; overflow: hidden; background: #000; border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .vid-panel h2 { position: absolute; top: 0; left: 0; right: 0; padding: .8rem 1.1rem; margin: 0; background: linear-gradient(rgba(0,0,0,0.8), transparent); z-index: 2; color: var(--gold); font-size: 1.7rem; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .vid-container { flex: 1; position: relative; height: 100%; width: 100%; display: flex; }
  .vid-container video { width: 100%; height: 100%; object-fit: contain; outline: none; cursor: pointer; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 1.2rem;
    padding: 1rem 1.3rem; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .panel h2 { font-size: 1.9rem; color: var(--gold); margin-bottom: .6rem; display: flex; justify-content: space-between; align-items: center; }
  .panel h2 small { font-size: 1.1rem; color: var(--muted); font-weight: 400; }

  /* current period */
  .now { background: rgba(0,0,0,.25); border-radius: 1rem; padding: .8rem 1rem; margin-bottom: .7rem; text-align: center; }
  .now .label { font-size: 1.2rem; color: var(--muted); }
  .now .name { font-size: 3rem; font-weight: 700; margin: .1rem 0; }
  .now.class .name { color: var(--green); }
  .now.break .name { color: var(--gold); }
  .now .count { font-size: 3.2rem; font-weight: 700; direction: ltr; font-variant-numeric: tabular-nums; }
  .now .count-label { font-size: 1.1rem; color: var(--muted); }
  .bar { height: .6rem; background: rgba(255,255,255,.15); border-radius: 1rem; margin-top: .5rem; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); transition: width 1s linear; }
  .next { display: flex; justify-content: space-between; align-items: center; background: rgba(246,196,83,.12); border: 1px solid rgba(246,196,83,.4); border-radius: .8rem; padding: .5rem 1rem; margin-bottom: .6rem; font-size: 1.5rem; }
  .next b { color: var(--gold); }
  .periods { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: .3rem; min-height: 0; }
  .p { display: flex; justify-content: space-between; align-items: center; padding: .25rem .8rem; border-radius: .6rem; font-size: 1.35rem; flex: 1; background: rgba(255,255,255,.05); }
  .p .t { direction: ltr; color: var(--muted); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .p.done { opacity: .35; text-decoration: line-through; }
  .p.current { background: var(--green); color: #05301e; font-weight: 700; }
  .p.current .t { color: #05301e; }
  .p.break { border: 1px dashed var(--gold); }
  .p.current.break { background: var(--gold); color: #3a2a00; }

  /* news */
  .news-item { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: fade .8s; }
  .news-item img { width: 100%; max-height: 38%; object-fit: cover; border-radius: .8rem; margin-bottom: .7rem; }
  .news-item h3 { font-size: 2.5rem; line-height: 1.35; margin-bottom: .5rem; }
  .news-item p { font-size: 1.9rem; line-height: 1.7; color: #e6eef8; overflow: hidden; }
  .news-item .date { font-size: 1.1rem; color: var(--muted); margin-top: auto; padding-top: .4rem; }
  .dots { display: flex; gap: .4rem; justify-content: center; margin-top: .5rem; }
  .dots i { width: .7rem; height: .7rem; border-radius: 50%; background: rgba(255,255,255,.25); }
  .dots i.on { background: var(--gold); }
  .empty { margin: auto; color: var(--muted); font-size: 1.6rem; text-align: center; }
  @keyframes fade { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }

  /* exams */
  .ex-view { flex: 1; animation: fade .8s; display: flex; flex-direction: column; gap: .4rem; min-height: 0; overflow: hidden; }
  .ex-row { display: grid; grid-template-columns: 1.1fr 1.4fr 1fr; gap: .5rem; align-items: center; background: rgba(255,255,255,.07); border-radius: .7rem; padding: .45rem .8rem; font-size: 1.35rem; }
  .ex-row .d { color: var(--gold); }
  .ex-row .g { color: var(--muted); font-size: 1.1rem; }
  .ex-row.today { background: var(--red); }
  .ex-row.today .d, .ex-row.today .g { color: #fff; }
  .inst { display: flex; gap: .7rem; align-items: flex-start; font-size: 1.55rem; line-height: 1.5; background: rgba(255,255,255,.07); border-radius: .7rem; padding: .5rem .8rem; }
  .inst .n { background: var(--gold); color: #3a2a00; font-weight: 700; min-width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; }

  /* ticker */
  .ticker { background: var(--gold); color: #1b1300; border-radius: 1.2rem; height: 7.5rem; display: flex; align-items: stretch; overflow: hidden; border: .25rem solid #fff3; }
  .ticker .tag { background: #1b1300; color: var(--gold); display: grid; place-items: center; padding: 0 2rem; font-size: 2.4rem; font-weight: 700; white-space: nowrap; }
  .ticker .view { flex: 1; overflow: hidden; direction: ltr; position: relative; }
  .track { display: inline-flex; height: 100%; align-items: center; white-space: nowrap; will-change: transform; }
  .msg { font-size: 3.6rem; font-weight: 700; padding: 0 2rem; direction: rtl; }
  .msg.urgent { color: #b00000; }
  .sep { font-size: 3rem; opacity: .7; }
  .ticker.hasurgent { animation: blink 1.6s infinite; }
  @keyframes blink { 50% { background: #ffe08a; } }

  /* updated v2 compact layout */
  .title h1 { font-size: 3rem; }
  .clock .time { font-size: 4.2rem; }
  .panel { padding: .8rem 1.1rem; }
  .panel h2 { font-size: 1.7rem; margin-bottom: .4rem; }
  .now { display: grid; grid-template-columns: 1fr auto; column-gap: 1rem; align-items: center; padding: .5rem .9rem; margin-bottom: .5rem; text-align: right; }
  .now .nl { text-align: right; min-width: 0; }
  .now .nl:only-child { grid-column: 1 / -1; text-align: center; }
  .now .nr { text-align: center; }
  .now .bar { grid-column: 1 / -1; margin-top: .4rem; }
  .now .label { font-size: 1.1rem; }
  .now .name { font-size: 2.5rem; margin: 0; line-height: 1.15; }
  .now .count { font-size: 3.6rem; line-height: 1; }
  .now .count-label { font-size: 1rem; }
  .next { font-size: 1.35rem; padding: .35rem .9rem; margin-bottom: .5rem; }
  .periods { flex: 1 1 0; gap: .25rem; }
  .p { flex: 1 1 0; min-height: 0; padding: 0 .8rem; font-size: 1em; line-height: 1; overflow: hidden; }
  .p .t { font-size: .9em; }
  .ex-view { font-size: 1.35rem; }
  .ex-view.instv { font-size: 1.55rem; }
  .ex-row { grid-template-columns: .95fr 1fr 1.25fr; gap: .6em; font-size: 1em; padding: .4em .7em; border-radius: .6em; }
  .ex-row .s { font-weight: 700; }
  .ex-row .g { font-size: .8em; }
  .ex-row .d .dn { color: var(--gold); }
  .ex-row.today .d .dn, .ex-row.today .g { color: #fff; }
  .inst { font-size: 1em; }
  .inst .n { min-width: 1.4em; height: 1.4em; font-size: .8em; }
  .news-item { font-size: 1.9rem; overflow: hidden; }
  .news-item h3 { font-size: 1.3em; margin-bottom: .3em; }
  .news-item p { font-size: 1em; line-height: 1.6; overflow: visible; }
  .news-item .date { font-size: .6em; }
  .ticker { height: 6.5rem; }
  .ticker .tag { font-size: 2.2rem; }
  .msg { font-size: 3.2rem; }

  /* ===== زر الإدارة ولوحة التحكم ===== */
  #gear { position: fixed; bottom: .3rem; left: .3rem; z-index: 50; background: none; border: 0; color: #fff; opacity: .25; font-size: 1.8rem; cursor: pointer; padding: .3rem .5rem; }
  #gear:hover { opacity: .9; }
  #adminOverlay { position: fixed; inset: 0; background: #eef2f7; color: #12263f; z-index: 100; overflow: auto; display: none; font-size: 16px; cursor: auto; user-select: text; line-height: 1.4; }
  #adminOverlay *, #adminOverlay *::before, #adminOverlay *::after { box-sizing: border-box; }
  #adminOverlay .ahead { background: #0b2a4a; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
  #adminOverlay .ahead h1 { font-size: 20px; margin: 0; }
  #adminOverlay .awrap { max-width: 1000px; margin: 0 auto; padding: 16px 16px 100px; }
  #adminOverlay .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #adminOverlay .tabs button { padding: 10px 16px; border: 0; border-radius: 8px; background: #fff; cursor: pointer; font-size: 15px; font-family: inherit; color: #12263f; }
  #adminOverlay .tabs button.on { background: #0b2a4a; color: #fff; }
  #adminOverlay .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px #0002; }
  #adminOverlay .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 10px; border: 1px solid #d9e2ee; border-radius: 10px; margin-bottom: 10px; background: #f8fafc; }
  #adminOverlay .f { display: flex; flex-direction: column; gap: 3px; flex: 1 1 160px; }
  #adminOverlay .f.wide { flex: 3 1 300px; }
  #adminOverlay .f.small { flex: 0 1 110px; }
  #adminOverlay label { font-size: 12px; color: #5b6f89; }
  #adminOverlay input, #adminOverlay textarea, #adminOverlay select { font: inherit; padding: 8px; border: 1px solid #c3cfdf; border-radius: 8px; width: 100%; background: #fff; color: #12263f; }
  #adminOverlay textarea { min-height: 70px; resize: vertical; }
  #adminOverlay button.btn { font-family: inherit; font-size: 15px; padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer; background: #0b2a4a; color: #fff; }
  #adminOverlay button.add { background: #1c8c5a; }
  #adminOverlay button.mini { padding: 6px 10px; background: #d9e2ee; color: #12263f; }
  #adminOverlay button.del { background: #e23c3c; color: #fff; }
  #adminOverlay .save { position: fixed; bottom: 16px; left: 16px; background: #f08c00 !important; font-size: 18px !important; padding: 14px 26px !important; box-shadow: 0 3px 10px #0004; z-index: 9; }
  #adminOverlay #toast { position: fixed; bottom: 80px; left: 16px; background: #1c8c5a; color: #fff; padding: 10px 18px; border-radius: 8px; display: none; z-index: 9; }
  #adminOverlay #toast.err { background: #e23c3c; }
  #adminOverlay .hint { color: #5b6f89; font-size: 13px; margin: 0 0 12px; }
  #adminOverlay #login { max-width: 360px; margin: 14vh auto; text-align: center; }
  #adminOverlay #login h2 { margin: 0 0 6px; }
  #adminOverlay #login input { margin: 12px 0; text-align: center; }
  #adminOverlay .days { display: flex; gap: 10px; flex-wrap: wrap; }
  #adminOverlay .days label { font-size: 15px; color: #12263f; display: flex; gap: 4px; align-items: center; }
  #adminOverlay .days input { width: auto; }
  #adminOverlay .chk { flex-direction: row; align-items: center; gap: 6px; flex: 0 1 140px; }
  #adminOverlay .chk input { width: auto; }
</style>
</head>
<body>
<header>
  <div class="datebox"><div id="greg"></div><div class="hijri" id="hijri"></div></div>
  <div class="title"><h1 id="school">مدرسة بلال بن رباح للبنين</h1><p id="subtitle"></p></div>
  <div class="clock"><span class="time" id="hm">--:--</span><span class="sec" id="ss">--</span><span class="ampm" id="ampm"></span></div>
</header>

<main>
  <section class="panel">
    <h2>الجدول المدرسي <small id="dayname"></small></h2>
    <div class="now" id="now"></div>
    <div class="next" id="next"></div>
    <div class="periods" id="periods"></div>
  </section>

  <section class="vid-panel">
    <h2>شاشة العرض</h2>

      <div id="unmuteOverlay" style="display:none; position: absolute; bottom: 1rem; right: 1rem; background: rgba(0,0,0,0.7); color: #fff; padding: .5rem 1rem; border-radius: 2rem; cursor: pointer; z-index: 10; font-size: 1.2rem; border: 1px solid var(--line); transition: 0.3s; pointer-events: auto;">🔇 اضغط لتشغيل الصوت</div>
    </div>
  </section>

  <div class="left-col">
    <section class="panel">
      <h2>أخبار المدرسة <small id="newscount"></small></h2>
      <div id="newsbox" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
      <div class="dots" id="dots"></div>
    </section>

    <section class="panel">
      <h2><span id="exTitle">جدول الاختبارات</span><small id="exSub"></small></h2>
      <div id="exbox" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
    </section>
  </div>
</main>

<div class="ticker" id="tickerBox">
  <div class="tag">📢 تعليمات</div>
  <div class="view" id="tickerView"><div class="track" id="track"></div></div>
</div>

<button id="gear" title="الإدارة">⚙</button>
<div id="adminOverlay" dir="rtl">
  <div id="login" class="card">
    <h2>لوحة تحكم الإدارة</h2>
    <p class="hint">مدرسة بلال بن رباح للبنين</p>
    <input type="password" id="pw" placeholder="كلمة المرور" dir="ltr">
    <button class="btn" id="loginBtn" style="width:100%">دخول</button>
    <button class="btn mini" id="cancelLogin" style="width:100%;margin-top:8px">رجوع للشاشة</button>
    <p id="loginErr" style="color:#e23c3c"></p>
  </div>
  <div id="app" style="display:none">
    <div class="ahead"><h1>لوحة تحكم شاشة المدرسة</h1><button class="btn mini" id="closeBtn">إغلاق ✕</button></div>
    <div class="awrap">
      <div class="tabs" id="tabs"></div>
      <div class="card" id="content"></div>
    </div>
    <button class="btn save" id="saveBtn">💾 حفظ ونشر على الشاشة</button>
    <div id="toast"></div>
  </div>
</div>

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function nowParts() {
  const tz = (D && D.settings.timezone) || 'Asia/Muscat';
  const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short' });
  const o = {};
  f.formatToParts(new Date()).forEach(p => o[p.type] = p.value);
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(o.weekday);
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour, mi: +o.minute, s: +o.second, wd,
    secs: +o.hour * 3600 + +o.minute * 60 + +o.second, iso: `${o.year}-${o.month}-${o.day}` };
}
const toSecs = (t) => { const [h, m] = t.split(':').map(Number); return h * 3600 + m * 60; };
const pad = (n) => String(n).padStart(2, '0');
function fmtCount(s) { s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + pad(m) + ':' + pad(x); }
function t12(t) { let [h, m] = t.split(':').map(Number); h = h % 12 || 12; return h + ':' + pad(m); }

function shrinkToFit(box, startRem) {
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  let px = startRem * rem, guard = 0;
  box.style.fontSize = px + 'px';
  while (box.scrollHeight > box.clientHeight + 1 && px > 9 && guard++ < 40) { px *= 0.94; box.style.fontSize = px + 'px'; }
}
function fitList(list, count) {
  const h = list.clientHeight;
  if (!h || !count) return;
  const gap = parseFloat(getComputedStyle(list).rowGap) || 0;
  const rowH = (h - gap * (count - 1)) / count;
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  list.style.fontSize = Math.max(9, Math.min(rowH * 0.62, rem * 1.5)) + 'px';
}
function fillNow(now, o) {
  const L = el('div', 'nl');
  if (o.label) L.append(el('div', 'label', o.label));
  if (o.name) L.append(el('div', 'name', o.name));
  now.append(L);
  if (o.count != null) { const R = el('div', 'nr'); R.append(el('div', 'count', o.count)); if (o.countLabel) R.append(el('div', 'count-label', o.countLabel)); now.append(R); }
  if (o.bar) now.append(o.bar);
}

function tick() {
  if (!D) return;
  const n = nowParts();
  const h12 = n.h % 12 || 12;
  $('hm').textContent = h12 + ':' + pad(n.mi);
  $('ss').textContent = ':' + pad(n.s);
  $('ampm').textContent = n.h < 12 ? 'صباحًا' : 'مساءً';
  $('dayname').textContent = DAYS[n.wd];

  const tz = D.settings.timezone || 'Asia/Muscat';
  $('greg').textContent = new Intl.DateTimeFormat('ar-OM-u-nu-latn', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
  try { $('hijri').textContent = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { timeZone: tz, day: 'numeric', month: 'long', year: 'numeric' }).format(new Date()); } catch (e) {}

  renderSchedule(n);
}

function renderSchedule(n) {
  const periods = (D.periods || []).filter(p => p.start && p.end).slice().sort((a, b) => toSecs(a.start) - toSecs(b.start));
  const isSchoolDay = (D.settings.schoolDays || []).includes(n.wd);
  const now = $('now'), next = $('next'), list = $('periods');

  let cur = -1;
  if (isSchoolDay) periods.forEach((p, i) => { if (n.secs >= toSecs(p.start) && n.secs < toSecs(p.end)) cur = i; });

  now.className = 'now';
  now.replaceChildren();
  next.replaceChildren();
  next.style.display = 'none';
  if (!isSchoolDay) {
    fillNow(now, { label: 'اليوم', name: 'عطلة نهاية الأسبوع' });
  } else if (cur >= 0) {
    const p = periods[cur];
    now.classList.add(p.type === 'break' ? 'break' : 'class');
    const left = toSecs(p.end) - n.secs, total = toSecs(p.end) - toSecs(p.start);
    const bar = el('div', 'bar'); const fill = el('i'); fill.style.width = ((total - left) / total * 100) + '%'; bar.append(fill);
    const what = p.type === 'break' ? 'الفسحة' : (p.type === 'assembly' ? 'الطابور' : 'الحصة');
    fillNow(now, { label: p.type === 'class' ? 'الحصة الحالية' : 'الآن', name: p.name, count: fmtCount(left), countLabel: 'المتبقي لانتهاء ' + what, bar });
    const nx = periods[cur + 1];
    next.style.display = 'flex';
    if (nx) { next.append(el('span', null, 'التالية:'), el('b', null, nx.name), el('span', null, 'تبدأ ' + t12(nx.start) + ' · بعد ' + fmtCount(toSecs(nx.start) - n.secs))); }
    else { next.append(el('span', null, 'هذه آخر حصة في اليوم')); }
  } else if (periods.length && n.secs < toSecs(periods[0].start)) {
    const p = periods[0];
    fillNow(now, { label: 'اليوم الدراسي يبدأ بعد', count: fmtCount(toSecs(p.start) - n.secs), countLabel: 'بداية: ' + p.name });
  } else if (periods.length && n.secs >= toSecs(periods[periods.length - 1].end)) {
    fillNow(now, { label: 'انتهى اليوم الدراسي', name: 'مع السلامة 👋' });
  } else if (periods.length) {
    const nx = periods.find(p => toSecs(p.start) > n.secs);
    fillNow(now, { label: 'استراحة قصيرة بين الفقرات', count: fmtCount(toSecs(nx.start) - n.secs), countLabel: 'حتى بداية: ' + nx.name });
  } else {
    fillNow(now, { label: 'لم يتم إدخال جدول الحصص بعد' });
  }

  // list (rebuild only when changed)
  const key = cur + '|' + isSchoolDay + '|' + sigs.periods;
  if (sigs.listKey !== key) {
    sigs.listKey = key;
    list.replaceChildren();
    periods.forEach((p, i) => {
      const row = el('div', 'p' + (p.type === 'break' ? ' break' : ''));
      if (isSchoolDay && i === cur) row.classList.add('current');
      else if (isSchoolDay && n.secs >= toSecs(p.end)) row.classList.add('done');
      row.append(el('span', null, p.name), el('span', 't', t12(p.start) + ' - ' + t12(p.end)));
      list.append(row);
    });
    fitList(list, periods.length);
  }
}

let exView = 0, exTimer = null;
function showExams() {
  const box = $('exbox'); box.replaceChildren();
  const n = nowParts();
  const exams = (D.exams || []).filter(e => e.date >= n.iso).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const inst = D.examInstructions || [];
  const PER = 7;
  const views = [];
  for (let i = 0; i < exams.length; i += PER) views.push({ t: 'exams', items: exams.slice(i, i + PER), page: i / PER + 1, pages: Math.ceil(exams.length / PER) });
  if (!exams.length) views.push({ t: 'none' });
  if (inst.length) views.push({ t: 'inst' });
  const v = views[exView % views.length];
  const wrap = el('div', 'ex-view');
  if (v.t !== 'inst') {

    $('exSub').textContent = v.t === 'exams' && v.pages > 1 ? v.page + ' / ' + v.pages : '';
    if (v.t === 'none') wrap.append(el('div', 'empty', 'لا توجد اختبارات قادمة'));
    else v.items.forEach(e => {
      const dt = new Date(e.date + 'T12:00:00');
      const today = e.date === n.iso;
      const row = el('div', 'ex-row' + (today ? ' today' : ''));
      const d = el('div', 'd');
      d.append(el('div', 'dn', DAYS[dt.getDay()] + (today ? ' · اليوم' : '')),

      row.append(d, el('div', 's', e.subject || ''), el('div', 'g', e.grade || ''));

    shrinkToFit(wrap, 1.35);

    $('exTitle').textContent = 'تعليمات الاختبارات'; $('exSub').textContent = '';

    shrinkToFit(wrap, 1.55);
  }
}

function buildTicker() {
  const items = (D.ticker || []).filter(t => t.text && t.text.trim());
  const track = $('track'), box = $('tickerBox');
  track.replaceChildren(); track.style.animation = 'none';
  box.classList.toggle('hasurgent', items.some(i => i.urgent));
  if (!items.length) { track.append(el('div', 'msg', D.settings.schoolName)); return; }
  const makeSet = () => {
    const f = document.createDocumentFragment();
    items.forEach(i => { f.append(el('span', 'msg' + (i.urgent ? ' urgent' : ''), (i.urgent ? '⚠ ' : '') + i.text), el('span', 'sep', '◆')); });
    return f;
  };
  const half = el('div'); half.style.display = 'inline-flex'; half.style.alignItems = 'center';
  half.append(makeSet());
  track.append(half);
  const viewW = $('tickerView').clientWidth;
  let setW = half.scrollWidth, reps = 1;
  while (setW * reps < viewW && reps < 20) { half.append(makeSet()); reps++; }
  const halfW = half.scrollWidth;
  track.append(half.cloneNode(true));
  const speed = (D.settings.tickerSpeed || 5) * window.innerHeight * 0.03; // px/s
  track.style.animation = `scrollr ${halfW / speed}s linear infinite`;
  const st = document.getElementById('kf') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'kf' }));
  st.textContent = `@keyframes scrollr { from { transform: translateX(-${halfW}px); } to { transform: translateX(0); } }`;
}

/* ---------- video player ---------- */
let currentVideoIdx = 0;
function playCurrentVideo() {
  const vids = D.videos || [];
  const v = $('mainVideo');
  const msg = $('noVideoMsg');
  const unmuteBtn = $('unmuteOverlay');
  
  if (!v) return;
  if (!vids.length) {
    v.style.display = 'none';
    msg.style.display = 'flex';
    if (unmuteBtn) unmuteBtn.style.display = 'none';
    v.pause();
    return;
  }
  v.style.display = 'block';
  msg.style.display = 'none';
  if (currentVideoIdx >= vids.length) currentVideoIdx = 0;
  
  if (v.src !== vids[currentVideoIdx]) {
    v.src = vids[currentVideoIdx];
    
    // محاولة تشغيل الفيديو مع الصوت
    const playPromise = v.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        // نجح التشغيل. إذا كان مكتوماً نظهر الزر، وإلا نخفيه
        if (unmuteBtn) unmuteBtn.style.display = v.muted ? 'block' : 'none';
      }).catch(e => {
        // المتصفح منع التشغيل التلقائي بالصوت (سياسة الحماية)
        console.warn('منع المتصفح التشغيل التلقائي بالصوت. جاري التشغيل الصامت.');
        v.muted = true; // نكتم الصوت إجبارياً ليبدأ التشغيل
        if (unmuteBtn) unmuteBtn.style.display = 'block'; // نظهر زر طلب تشغيل الصوت
        v.play().catch(err => console.error("فشل التشغيل تماماً", err));
      });
    }
  }
}

// Attach video events once
const mainVid = $('mainVideo');
const unmuteBtn = $('unmuteOverlay');
if (mainVid) {
  mainVid.onended = () => { currentVideoIdx++; playCurrentVideo(); };
  mainVid.onerror = () => { currentVideoIdx++; playCurrentVideo(); };
  
  const toggleMute = (e) => { 
    if (e) e.stopPropagation();
    mainVid.muted = !mainVid.muted; 
    if (unmuteBtn) unmuteBtn.style.display = mainVid.muted ? 'block' : 'none';
    if (mainVid.paused) mainVid.play();
  };
  
  mainVid.onclick = toggleMute;
  if (unmuteBtn) unmuteBtn.onclick = toggleMute;
}

function applyData(nd) {
  const first = !D;
  nd.settings = Object.assign({ schoolName: '', timezone: 'Asia/Muscat', schoolDays: [0, 1, 2, 3, 4] }, nd.settings || {});
  D = nd;
  const s = JSON.stringify;
  $('school').textContent = D.settings.schoolName || '';
  $('subtitle').textContent = D.settings.subtitle || '';
  document.title = D.settings.schoolName || 'شاشة المدرسة';
  const nsig = { news: s([D.news, D.settings.newsSeconds]), exams: s([D.exams, D.examInstructions, D.settings.examPanelSeconds]), ticker: s([D.ticker, D.settings.tickerSpeed]), periods: s([D.periods, D.settings.schoolDays]), videos: s(D.videos) };
  if (first || nsig.news !== sigs.news) startNews();
  if (first || nsig.exams !== sigs.exams) startExams();
  if (first || nsig.ticker !== sigs.ticker) buildTicker();
  if (first || nsig.videos !== sigs.videos) playCurrentVideo();
  sigs = Object.assign({}, nsig, { listKey: nsig.periods !== sigs.periods ? null : sigs.listKey });
  tick();
}

async function initAuth() {
    try {
        if (typeof __initial_auth_token !== 'undefined') {
            try {
                await signInWithCustomToken(auth, __initial_auth_token);
            } catch (tokenError) {
                console.warn("فشل تسجيل الدخول بالرمز المخصص، جاري الدخول كمجهول...", tokenError);
                await signInAnonymously(auth);
            }
        } else {
            await signInAnonymously(auth);
        }
    } catch (error) {
        console.error("Auth error", error);
    }
}

onAuthStateChanged(auth, (user) => {
    if (user) {
        currentUser = user;
        startDatabaseSync();
    }
});

function startDatabaseSync() {
    if (!currentUser) return;
    
    // Using explicit mandatory path rule
    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schoolBoard', 'main');
    
    onSnapshot(docRef, (snapshot) => {
        if (snapshot.exists()) {
            let data = snapshot.data();
            
            // Maintenance for older versions backwards-compatibility
            if (data && data.settings && (data.rev || 0) < DEFAULT.rev) {
                data.periods = JSON.parse(JSON.stringify(DEFAULT.periods));
                data.exams = JSON.parse(JSON.stringify(DEFAULT.exams));
                data.settings.examTitle = DEFAULT.settings.examTitle;
                data.rev = DEFAULT.rev;
            }
            
            applyData(data);
        } else {
            // Document doesn't exist, seed it with default configuration
            applyData(JSON.parse(JSON.stringify(DEFAULT)));
            setDoc(docRef, DEFAULT).catch(console.error);
        }
    }, (error) => {
        console.error("Firestore read error:", error);
    });
}

function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
function openAdmin() {
  $('adminOverlay').style.display = 'block'; $('login').style.display = 'block'; $('app').style.display = 'none';
  $('pw').value = ''; $('loginErr').textContent = ''; setTimeout(() => $('pw').focus(), 50);
}
function closeAdmin() { $('adminOverlay').style.display = 'none'; }
function login() {
  const real = normDigits((D.settings && D.settings.adminPassword) || '1234');
  if (normDigits($('pw').value) !== real) { $('loginErr').textContent = 'كلمة المرور غير صحيحة'; return; }
  ED = normalizeData(JSON.parse(JSON.stringify(D)));
  $('login').style.display = 'none'; $('app').style.display = 'block';
  render();
}

async function save() {
  if (!currentUser) {
      toast('عذرًا، أنت لست متصلاً بقاعدة البيانات', true);
      return;
  }
  
  $('saveBtn').textContent = '⏳ جاري الحفظ...';
  $('saveBtn').disabled = true;
  
  try {
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schoolBoard', 'main');
      await setDoc(docRef, ED);
      
      // Update UI optimistically locally
      applyData(JSON.parse(JSON.stringify(ED)));
      toast('تم الحفظ وستظهر التغييرات فوراً على كل الشاشات ✔');
  } catch (e) {
      console.error(e);
      toast('حدث خطأ أثناء الاتصال بالخادم، لم يتم الحفظ', true);
  } finally {
      $('saveBtn').textContent = '💾 حفظ ونشر على الشاشة';
      $('saveBtn').disabled = false;
  }
}

function dataTools(root) {
  const bar = document.createElement('div'); bar.style.cssText = 'margin-top:24px;padding-top:16px;border-top:1px solid #d9e2ee;display:flex;gap:8px;flex-wrap:wrap';
  const mk = (t, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = t; b.onclick = fn; return b; };
  const file = document.createElement('input'); file.type = 'file'; file.accept = '.json,application/json'; file.style.display = 'none';
  file.onchange = () => {
    const f = file.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { ED = normalizeData(JSON.parse(r.result)); render(); toast('تم الاستيراد، اضغط حفظ لتطبيقه على الشاشات'); } catch (e) { toast('الملف غير صالح', true); } };
    r.readAsText(f);
  };
  bar.append(
    mk('⬇ تصدير نسخة احتياطية', '', () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(ED, null, 2)], { type: 'application/json' }));
      a.download = 'school-data.json'; a.click();
    }),
    mk('⬆ استيراد نسخة', '', () => file.click()),
    mk('↺ استرجاع البيانات الافتراضية', 'del', () => { if (confirm('سيتم استبدال كل المحتوى الحالي بالبيانات الافتراضية. متابعة؟')) { ED = normalizeData(JSON.parse(JSON.stringify(DEFAULT))); render(); toast('تم الاسترجاع، اضغط حفظ لتطبيقه على الشاشات'); } }),
    file
  );
  root.append(bar);
}
const TABS = [
  ['ticker', '📢 الشريط التفاعلي'], ['news', '📰 الأخبار'], ['videos', '🎥 شاشة العرض'], 
  ['exams', '📝 جدول الاختبارات'], ['inst', '📋 تعليمات الاختبارات'], 
  ['periods', '🕒 الحصص'], ['general', '⚙ إعدادات عامة'],
];
function render() {
  const tabs = $('tabs'); tabs.replaceChildren();
  TABS.forEach(([k, t]) => { const b = document.createElement('button'); b.textContent = t; if (k === tab) b.className = 'on'; b.onclick = () => { tab = k; render(); }; tabs.append(b); });
  const c = $('content'); c.replaceChildren();
  const h = (txt) => { const p = document.createElement('p'); p.className = 'hint'; p.textContent = txt; c.append(p); };
  const box = document.createElement('div');
  if (tab === 'ticker') {
    h('الرسائل تتحرك على الشريط الكبير أسفل الشاشة. فعّل "عاجل" ليظهر الشريط باللون الأحمر ويومض.');
    listEditor(box, ED.ticker, [{ k: 'text', l: 'نص التعليمة', wide: 1, type: 'textarea' }, { k: 'urgent', l: 'عاجل', type: 'check' }], () => ({ text: '', urgent: false }));
  } else if (tab === 'videos') {
    h('أضف روابط مقاطع الفيديو المباشرة (مثل روابط مقاطع MP4 من Google Cloud Storage). سيتم تشغيلها تباعاً في وسط الشاشة. (اضغط على الفيديو في الشاشة لتشغيل/كتم الصوت).');
    const arr = ED.videos || [];
    const wrap = arr.map((t) => ({ url: t }));
    listEditor(box, wrap, [{ k: 'url', l: 'رابط الفيديو المباشر (mp4)', wide: 1, type: 'textarea' }], () => ({ url: '' }), () => { ED.videos = wrap.map(w => w.url); });
    ED.videos = wrap.map(w => w.url);
  } else if (tab === 'news') {
    h('الأخبار تظهر بالتناوب في ركن الأخبار. رابط الصورة اختياري (مثال: https://...).');
    listEditor(box, ED.news, [{ k: 'title', l: 'العنوان', wide: 1 }, { k: 'date', l: 'التاريخ', type: 'date', small: 1 }, { k: 'body', l: 'نص الخبر', wide: 1, type: 'textarea' }, { k: 'image', l: 'رابط صورة (اختياري)', wide: 1 }], () => ({ title: '', body: '', date: new Date().toISOString().slice(0, 10), image: '' }));
  } else if (tab === 'exams') {
    h('اكتب كل مادة في سطر مع الصفوف المعنية بها (مثل: الصفوف 5 – 8). الاختبارات التي مر تاريخها تختفي تلقائيًا من الشاشة، واختبار اليوم يظهر باللون الأحمر.');
    listEditor(box, ED.exams, [{ k: 'subject', l: 'المادة' }, { k: 'grade', l: 'الصفوف المعنية (نص حر)' }, { k: 'date', l: 'التاريخ', type: 'date' }, { k: 'time', l: 'الوقت', type: 'time', small: 1 }], () => ({ subject: '', grade: '', date: '', time: '07:15' }));
  } else if (tab === 'inst') {
    h('تعليمات الاختبارات تظهر بالتناوب مع جدول الاختبارات في نفس الركن.');
    const arr = ED.examInstructions;
    const wrap = arr.map((t) => ({ text: t }));
    // adapter: edit as objects, sync back to strings
    listEditor(box, wrap, [{ k: 'text', l: 'التعليمة', wide: 1, type: 'textarea' }], () => ({ text: '' }), () => { ED.examInstructions = wrap.map(w => w.text); });
    ED.examInstructions = wrap.map(w => w.text);
  } else if (tab === 'periods') {
    h('أوقات الحصص بنظام 24 ساعة. النوع: حصة / فسحة / طابور.');
    listEditor(box, ED.periods, [{ k: 'name', l: 'الاسم' }, { k: 'start', l: 'من', type: 'time', small: 1 }, { k: 'end', l: 'إلى', type: 'time', small: 1 }, { k: 'type', l: 'النوع', type: 'select', opts: [['class', 'حصة'], ['break', 'فسحة'], ['assembly', 'طابور']], small: 1 }], () => ({ name: '', start: '', end: '', type: 'class' }));
  } else {
    generalEditor(box); dataTools(box);
  }
  c.append(box);
}

function listEditor(root, arr, fields, newItem, onChange) {
  root.replaceChildren();
  const changed = () => { if (onChange) onChange(); };
  arr.forEach((it, i) => {
    const row = document.createElement('div'); row.className = 'row';
    fields.forEach((f) => {
      const d = document.createElement('div'); d.className = 'f' + (f.wide ? ' wide' : '') + (f.small ? ' small' : '') + (f.type === 'check' ? ' chk' : '');
      const l = document.createElement('label'); l.textContent = f.l;
      let inp;
      if (f.type === 'textarea') inp = document.createElement('textarea');
      else if (f.type === 'select') { inp = document.createElement('select'); f.opts.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; inp.append(o); }); }
      else { inp = document.createElement('input'); inp.type = f.type === 'check' ? 'checkbox' : (f.type || 'text'); }
      if (f.type === 'check') { inp.checked = !!it[f.k]; inp.onchange = () => { it[f.k] = inp.checked; changed(); }; d.append(inp, l); }
      else { inp.value = it[f.k] || ''; inp.oninput = () => { it[f.k] = inp.value; changed(); }; d.append(l, inp); }
      row.append(d);
    });
    const ctl = document.createElement('div'); ctl.style.display = 'flex'; ctl.style.gap = '4px';
    const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'btn mini ' + cls; b.textContent = txt; b.onclick = fn; return b; };
    ctl.append(
      mk('▲', '', () => { if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; changed(); listEditor(root, arr, fields, newItem, onChange); } }),
      mk('▼', '', () => { if (i < arr.length - 1) { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; changed(); listEditor(root, arr, fields, newItem, onChange); } }),
      mk('حذف', 'del', () => { if (confirm('حذف هذا العنصر؟')) { arr.splice(i, 1); changed(); listEditor(root, arr, fields, newItem, onChange); } })
    );
    row.append(ctl); root.append(row);
  });
  const add = document.createElement('button'); add.className = 'btn add'; add.textContent = '+ إضافة';
  add.onclick = () => { arr.push(newItem()); changed(); listEditor(root, arr, fields, newItem, onChange); };
  root.append(add);
}

function generalEditor(root) {
  const s = ED.settings;
  const field = (label, key, type) => {
    const d = document.createElement('div'); d.className = 'f'; d.style.marginBottom = '10px';
    const l = document.createElement('label'); l.textContent = label;
    const i = document.createElement('input'); i.type = type || 'text'; i.value = s[key] ?? '';
    i.oninput = () => { s[key] = type === 'number' ? +i.value : i.value; };
    d.append(l, i); root.append(d);
  };
  field('اسم المدرسة', 'schoolName'); field('السطر الفرعي تحت الاسم', 'subtitle');
  field('المنطقة الزمنية', 'timezone');
  field('سرعة الشريط (1 بطيء - 10 سريع)', 'tickerSpeed', 'number');
  field('مدة عرض الخبر الواحد (ثانية)', 'newsSeconds', 'number');
  field('مدة التبديل بين الاختبارات والتعليمات (ثانية)', 'examPanelSeconds', 'number');
  field('عنوان ركن الاختبارات', 'examTitle');
  field('كلمة مرور لوحة الإدارة', 'adminPassword');
  const lab = document.createElement('label'); lab.textContent = 'أيام الدراسة'; root.append(lab);
  const days = document.createElement('div'); days.className = 'days';
  DAYN.forEach((n, i) => {
    const l = document.createElement('label'); const c = document.createElement('input'); c.type = 'checkbox'; c.checked = s.schoolDays.includes(i);
    c.onchange = () => { s.schoolDays = s.schoolDays.filter(x => x !== i); if (c.checked) s.schoolDays.push(i); };
    l.append(c, n); days.append(l);
  });
  root.append(days);
}

$('gear').onclick = openAdmin;
$('cancelLogin').onclick = closeAdmin;
$('closeBtn').onclick = closeAdmin;
$('loginBtn').onclick = login;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('saveBtn').onclick = save;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAdmin(); });
</script>
